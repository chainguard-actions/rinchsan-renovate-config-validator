name: Test invalid renovate config fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy invalid renovate config fixture into workspace as a non-renovate-json name
        run: |
          # Use a name that does NOT contain 'renovate.json' as a substring,
          # so the action correctly copies it to renovate.json before validating.
          cp "$GITHUB_WORKSPACE/tests/fixtures/invalid-renovate.json" "$GITHUB_WORKSPACE/invalid-config.json"

      - id: action
        uses: .
        with:
          pattern: 'invalid-config.json'
        continue-on-error: true

      - name: Assert action failed for invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid renovate config"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid config but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
